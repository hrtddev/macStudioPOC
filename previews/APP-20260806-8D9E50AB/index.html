<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Balance Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Leave Balance Calculator</h1>
            <p>Estimate your remaining annual leave</p>
        </header>

        <main>
            <form id="leaveForm">
                <div class="form-group">
                    <label for="annualEntitlement">Annual Leave Entitlement (days)</label>
                    <input type="number" id="annualEntitlement" min="0" step="0.5" required>
                </div>

                <div class="form-group">
                    <label for="leaveTaken">Leave Taken (days)</label>
                    <input type="number" id="leaveTaken" min="0" step="0.5" required>
                </div>

                <div class="form-group">
                    <label for="plannedLeave">Planned Leave (days)</label>
                    <input type="number" id="plannedLeave" min="0" step="0.5" required>
                </div>

                <button type="submit">Calculate Balance</button>
            </form>

            <div id="result" class="result hidden">
                <h2>Leave Balance Summary</h2>
                <div class="balance-info">
                    <p><strong>Available Leave:</strong> <span id="availableLeave"></span> days</p>
                    <p><strong>Total Leave Used:</strong> <span id="totalUsed"></span> days</p>
                    <p><strong>Estimated Remaining:</strong> <span id="remainingLeave"></span> days</p>
                </div>
                <div id="warning" class="warning hidden">
                    <p>⚠️ Warning: Planned leave exceeds available balance!</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Leave Balance Calculator &copy; 2026</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
