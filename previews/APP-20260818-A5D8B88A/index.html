<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="score-board">
            <div class="score">
                <h2>Player</h2>
                <p id="player-score">0</p>
            </div>
            <div class="score">
                <h2>Draws</h2>
                <p id="draw-score">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="computer-score">0</p>
            </div>
        </div>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">✊ Rock</button>
            <button class="choice-btn" data-choice="paper">✋ Paper</button>
            <button class="choice-btn" data-choice="scissors">✌ Scissors</button>
        </div>

        <div class="result-container">
            <div class="user-choice">
                <p>You chose:</p>
                <p id="user-choice-display">-</p>
            </div>
            <div class="vs">VS</div>
            <div class="computer-choice">
                <p>Computer chose:</p>
                <p id="computer-choice-display">-</p>
            </div>
        </div>

        <div class="outcome" id="outcome">
            <!-- Outcome will be displayed here -->
        </div>

        <button id="reset-btn">Reset Score</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
